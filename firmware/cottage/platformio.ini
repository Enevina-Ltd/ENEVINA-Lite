[env:esp32s3_cottage_shadow]
platform = espressif32@7.0.1
; Same validated Arduino/ESP32-S3 packages as firmware/bench, not floating.
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
monitor_speed = 115200
build_unflags = -std=gnu++11 -Os
build_flags =
    -std=gnu++17
    -O3
    -I../../
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:esp32s3_cottage_bench]
extends = env:esp32s3_cottage_shadow
build_flags =
    ${env:esp32s3_cottage_shadow.build_flags}
    -DCOTTAGE_BENCH_MODE=1
