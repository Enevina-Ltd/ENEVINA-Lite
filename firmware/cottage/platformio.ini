[env:esp32s3_cottage_shadow]
platform = espressif32@7.0.1
; Same validated Arduino/ESP32-S3 packages as firmware/bench, not floating.
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
board = esp32-s3-devkitc-1
framework = arduino
# Arduino-ESP32 2.0.x compatible; replaces Bluedroid scan host.
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
# A regular PlatformIO USB upload includes the Arduino bootloader/otadata
# and can erase the rollback-capable boot chain. No USB flash in this target.
# Future app-only flashing requires a separately reviewed procedure.
upload_protocol = custom
upload_command = python3 block_usb_upload.py
monitor_speed = 115200
extra_scripts = pre:cottage_dashboard_build.py
build_unflags = -std=gnu++11 -Os
build_flags =
    -std=gnu++17
    -O3
    -I../../
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DCOTTAGE_SHARED_MEMORY_GUARD=1
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:esp32s3_cottage_bench]
extends = env:esp32s3_cottage_shadow
build_flags =
    ${env:esp32s3_cottage_shadow.build_flags}
    -DCOTTAGE_BENCH_MODE=1

[env:esp32s3_cottage_release]
extends = env:esp32s3_cottage_shadow
extra_scripts =
    ${env:esp32s3_cottage_shadow.extra_scripts}
    pre:cottage_reproducible_build.py


# Full-feature migration image for devices whose old OTA implementation
# has a hard transfer deadline. Same code, trust, partition and rollback
# chain; optimize size only. Never substitute a reduced-function loader.
[env:esp32s3_cottage_migration]
extends = env:esp32s3_cottage_release
build_unflags = -std=gnu++11 -O3
build_flags =
    ${env:esp32s3_cottage_release.build_flags}
    -Os
