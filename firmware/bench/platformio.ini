[env:esp32s3_generic_benchmark]
platform = espressif32@7.0.1
; Package versions recovered from the dedicated Core benchmark host.
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    platformio/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_flags = -std=gnu++17 -O3 -I../.. -DBOARD_HAS_PSRAM
build_unflags = -std=gnu++11 -Os
