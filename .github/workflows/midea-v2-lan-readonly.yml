name: Midea V2/V3 LAN read-only tests

on:
  push:
    branches:
      - feature/midea-v2-native-lan-20261119
  pull_request:
    paths:
      - '.github/workflows/midea-v2-lan-readonly.yml'
      - 'pump/midea_v3_protocol.*'
      - 'pump/midea_discovery.hpp'
      - 'tests/midea_lan_discovery_tests.cpp'
      - 'tests/test_midea_discovery_source.py'
      - 'pump/adapter_catalog.hpp'
      - 'firmware/cottage/**'
      - 'tests/midea_v2_protocol_tests.cpp'
      - 'tests/test_midea_v2_integration.py'
      - 'tests/midea_v3_protocol_tests.cpp'
      - 'tests/test_dashboard_translations.py'

permissions:
  contents: read

jobs:
  midea-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned ESP32-S3 build tools
        run: python -m pip install 'platformio==6.1.19' 'PyYAML>=6,<7'
      - name: Read-only V2/V3 source, NVS and dashboard checks
        run: |
          python -m unittest discover -s tests -p 'test_midea_v2_integration.py' -v
          python -m unittest discover -s tests -p 'test_midea_discovery_source.py' -v
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I. tests/midea_lan_discovery_tests.cpp -o /tmp/midea-lan-discovery-tests
          /tmp/midea-lan-discovery-tests
          python -m unittest discover -s tests -p 'test_dashboard_translations.py' -v
          python -m unittest discover -s tests -p 'test_frezzer_pair_from_core.py' -v
          python tools/check_release_hygiene.py
          node tests/test_c25_dashboard_ui.js
      - name: Native unit tests and protocol vectors
        run: |
          cmake -S . -B build-midea-v2-ci -DCMAKE_BUILD_TYPE=Release
          cmake --build build-midea-v2-ci -j2
          ctest --test-dir build-midea-v2-ci --output-on-failure
      - name: ESP32-S3 firmware build/link (no flash)
        run: python -m platformio run -d firmware/cottage -e esp32s3_cottage_shadow