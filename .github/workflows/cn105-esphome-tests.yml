name: CN105 ESPHome source provenance

on:
  pull_request:
    paths:
      - '.github/workflows/cn105-esphome-tests.yml'
      - 'integrations/cn105-esphome/**'
      - 'tools/prepare_cn105_esphome.py'
      - 'tests/cn105_bridge_poll_tests.cpp'

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test UART poll and Lite receiver
        run: |
          cmake -S . -B build-cn105 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cn105 -j 2 --target cn105_bridge_poll_tests cottage_cn105_source_proof_tests
          ctest --test-dir build-cn105 --output-on-failure -R 'cn105_(bridge_poll|source_proof)_tests'
      - name: Compile isolated ESPHome bridge
        run: |
          python -m pip install esphome==2026.10.0
          git clone --branch 2026.5.2 --single-branch https://github.com/echavet/MitsubishiCN105ESPHome.git build-cn105/upstream
          python tools/prepare_cn105_esphome.py build-cn105/upstream
          cp integrations/cn105-esphome/cn105-bench.yaml build-cn105/cn105-bench.yaml
          esphome compile build-cn105/cn105-bench.yaml
