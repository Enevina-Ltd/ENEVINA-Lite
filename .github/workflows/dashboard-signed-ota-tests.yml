name: Dashboard signed OTA regression

on:
  push:
    branches:
      - feature/dashboard-signed-ota-20261119
  pull_request:
    paths:
      - '.github/workflows/dashboard-signed-ota-tests.yml'
      - 'firmware/cottage/**'
      - 'cottage/mitsubishi_control_policy.hpp'
      - 'cottage/price_bootstrap.hpp'
      - 'cottage/mpc_arbiter.hpp'
      - 'cottage/mpc_planner.*'
      - 'cottage/plan_timeline.hpp'
      - 'tests/cottage_price_bootstrap_tests.cpp'
      - 'tests/cottage_mpc_control_tests.cpp'
      - 'tests/test_plan_timeline.js'
      - 'cottage/automatic_command_reconciliation.hpp'
      - 'cottage/learning_observation.hpp'
      - 'pump/pump_adapter.hpp'
      - 'tests/test_c2_heartbeat_plan_invalidation.py'
      - 'cottage/bounded_http_write.hpp'
      - 'cottage/bounded_http_request.hpp'
      - 'tests/bounded_http_request_tests.cpp'
      - 'tests/bounded_http_write_tests.cpp'
      - 'tests/bounded_web_transport_tests.cpp'
      - 'tests/support/bounded_web/**'
      - 'tests/test_bounded_web_source.py'
      - 'tests/test_history_busy_source.py'
      - 'tests/test_air_history_background.py'
      - 'tests/test_c23_binding_commit_order.py'
      - 'tests/test_cottage_c23_source.py'
      - 'tests/test_air_history_ui.js'
      - 'tests/test_history_view.js'
      - 'tests/test_dashboard_clarity.js'
      - 'tests/automatic_command_reconciliation_tests.cpp'
      - 'tests/test_automatic_command_reconciliation_source.py'
      - 'pump/gree_lan_protocol.*'
      - 'tests/gree_lan_protocol_tests.cpp'
      - 'tests/cottage_mitsubishi_control_tests.cpp'
      - 'tests/test_cn105_maintenance_runtime_source.py'
      - 'tests/test_control_rearm_nvs_source.py'
      - 'tests/test_mode_dwell_wiring.py'
      - 'tests/test_mpc_control_wiring.py'
      - 'tests/test_mpc_dashboard.js'
      - 'tests/cn105_gateway_request_tests.cpp'
      - 'tests/cottage_identification_tests.cpp'
      - 'cottage/cn105_gateway_request.hpp'
      - 'cottage/building_identification.*'
      - 'tests/test_dashboard_signed_ota.py'
      - 'tests/test_dashboard_translations.py'
      - 'tests/test_network_budget_diagnostic_source.py'
      - 'tests/test_boot_memory_admission.py'
      - 'firmware/main/market.*'
      - 'firmware/main/market_cache_compact.hpp'
      - 'firmware/main/forecast_memory.hpp'
      - 'tests/test_dashboard_transport_efficiency.py'
      - 'tests/test_regional_settings_source.py'
      - 'tests/test_optimizer_scratch_psram_source.py'
      - 'firmware/main/weather.*'
      - 'tests/test_crash_stack_source.py'
      - 'cottage/forecast_bridge.*'
      - 'tests/test_ota_runtime_source.py'
      - 'cottage/ota_image_staging.hpp'
      - 'cottage/ota_runtime_policy.hpp'
      - 'tests/ota_image_staging_tests.cpp'
      - 'tests/test_ota_signing.py'
      - 'tests/test_cottage_install_package.py'
      - 'tools/cottage_ota_*.py'
      - 'tools/cottage_install_package.py'
      - 'tests/test_wifi_onboarding_source.py'
      - 'tests/test_wifi_setup_ui.js'
      - 'tests/test_setup_wizard.js'
      - 'tests/wifi_provisioning_tests.cpp'
      - 'cottage/wifi_provisioning.hpp'

permissions:
  contents: read

jobs:
  dashboard-ota:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned toolchain
        run: python -m pip install platformio==6.1.19 cryptography==46.0.5
      - name: Dashboard, OTA policy and source tests
        run: |
          python3 -m unittest discover -s tests -p 'test_dashboard_signed_ota.py' -v
          python3 -m unittest discover -s tests -p 'test_dashboard_translations.py' -v
          python3 -m unittest discover -s tests -p 'test_dashboard_transport_efficiency.py' -v
          python3 -m unittest discover -s tests -p 'test_regional_settings_source.py' -v
          python3 -m unittest discover -s tests -p 'test_optimizer_scratch_psram_source.py' -v
          python3 -m unittest discover -s tests -p 'test_network_budget_diagnostic_source.py' -v
          python3 -m unittest discover -s tests -p 'test_boot_memory_admission.py' -v
          python3 -m unittest discover -s tests -p 'test_crash_stack_source.py' -v
          python3 -m unittest discover -s tests -p 'test_ota_runtime_source.py' -v
          g++ -std=c++17 -UNDEBUG -Wall -Wextra -Wpedantic -I. tests/ota_image_staging_tests.cpp -o /tmp/ota_image_staging_tests
          /tmp/ota_image_staging_tests
          python3 -m unittest discover -s tests -p 'test_ota_signing.py' -v
          python3 -m unittest discover -s tests -p 'test_cottage_install_package.py' -v
          python3 -m unittest discover -s tests -p 'test_wifi_onboarding_source.py' -v
          python3 -m unittest discover -s tests -p 'test_cn105_maintenance_runtime_source.py' -v
          python3 -m unittest discover -s tests -p 'test_control_rearm_nvs_source.py' -v
          python3 -m unittest discover -s tests -p 'test_mode_dwell_wiring.py' -v
          python3 -m unittest discover -s tests -p 'test_mpc_control_wiring.py' -v
          python3 -m unittest discover -s tests -p 'test_automatic_command_reconciliation_source.py' -v
          python3 -m unittest discover -s tests -p 'test_c2_heartbeat_plan_invalidation.py' -v
          python3 -m unittest discover -s tests -p 'test_bounded_web_source.py' -v
          python3 -m unittest discover -s tests -p 'test_history_busy_source.py' -v
          python3 -m unittest discover -s tests -p 'test_air_history_background.py' -v
          python3 -m unittest discover -s tests -p 'test_c23_binding_commit_order.py' -v
          python3 -m unittest discover -s tests -p 'test_cottage_c23_source.py' -v
          node tests/test_air_history_ui.js
          node tests/test_history_view.js
          node tests/test_dashboard_clarity.js
          node tests/test_mpc_dashboard.js
          node tests/test_plan_timeline.js
          node tests/test_c25_dashboard_ui.js
          node tests/test_wifi_setup_ui.js
          node tests/test_setup_wizard.js
      - name: Install native protocol test dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libcjson-dev
      - name: Native CMake suite
        run: |
          cmake -S . -B build-dashboard-ota-ci -DCMAKE_BUILD_TYPE=Release -DENEVINA_REQUIRE_NATIVE_PROTOCOL_TESTS=ON
          cmake --build build-dashboard-ota-ci -j 2
          ctest --test-dir build-dashboard-ota-ci --output-on-failure
      - name: Firmware build and link (no flash)
        run: python -m platformio run -d firmware/cottage -e esp32s3_cottage_shadow
