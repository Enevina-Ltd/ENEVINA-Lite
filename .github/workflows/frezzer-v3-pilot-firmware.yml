name: Frezzer V3 read-only pilot firmware

on:
  push:
    branches:
      - feature/midea-v3-native-lan-20261119
    paths:
      - '.github/workflows/frezzer-v3-pilot-firmware.yml'
      - 'firmware/**'
      - 'pump/**'
      - 'tests/**'
      - 'tools/frezzer_pair_from_core.py'
      - 'docs/field/FREZZER_NORDIC_V3_TEST_20261119.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout reviewed pilot branch
        uses: actions/checkout@v4
      - name: Prepare Python and pinned PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install 'platformio==6.1.19' 'PyYAML>=6.0,<7'
      - name: Run Midea UI and Core pairing offline tests
        run: |
          python -m unittest discover -s tests -p 'test_dashboard_translations.py' -v
          python -m unittest discover -s tests -p 'test_frezzer_pair_from_core.py' -v
      - name: Run native project tests
        run: |
          cmake -S . -B build-frezzer-ci -DCMAKE_BUILD_TYPE=Release
          cmake --build build-frezzer-ci -j 2
          ctest --test-dir build-frezzer-ci --output-on-failure
      - name: Compile ESP32-S3 firmware (no flash)
        run: python -m platformio run -d firmware/cottage -e esp32s3_cottage_shadow
      - name: Create integrity manifest
        run: |
          mkdir -p dist/frezzer-v3-readonly
          cp firmware/cottage/.pio/build/esp32s3_cottage_shadow/firmware.bin dist/frezzer-v3-readonly/
          cp docs/field/FREZZER_NORDIC_V3_TEST_20261119.md dist/frezzer-v3-readonly/TEST_NOTES.md
          (cd dist/frezzer-v3-readonly && sha256sum firmware.bin > SHA256SUMS)
          {
            echo "COMMIT=${GITHUB_SHA}"
            echo "BUILD_ENV=esp32s3_cottage_shadow"
            echo "BOARD=esp32-s3-devkitc-1"
            echo "FLASH=16MB QIO"
            echo "PSRAM=8MB OPI"
            echo "MODE=MIDEA_V3_READ_ONLY"
            echo "NOT_SIGNED_FOR_PRODUCTION_OTA=1"
            echo "NOT_INSTALLED_ON_DEVICE=1"
          } > dist/frezzer-v3-readonly/BUILD_INFO.txt
      - name: Upload test-only firmware and hash
        uses: actions/upload-artifact@v4
        with:
          name: enevina-lite-frezzer-v3-readonly-${{ github.sha }}
          path: dist/frezzer-v3-readonly
          if-no-files-found: error
          retention-days: 14