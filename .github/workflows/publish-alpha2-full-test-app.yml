name: Attach FULL alpha.2 N16R8 test firmware to release

on:
  push:
    branches:
      - release/alpha2-full-n16r8-app-20261119

permissions:
  contents: read

concurrency:
  group: enevina-alpha2-full-n16r8-test-asset
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: v0.1.0-alpha.2
      SOURCE_SHA: 95148822ec3385dbb13be2415fe04382e78c2d4b
      ASSET: Enevina-Lite-v0.1.0-alpha.2-ESP32-S3-N16R8-FULL-TEST-app.bin
      APP_SHA: e8f5b8a5e5233cd106c3ae4bb36ac61049be09de026d53ffd2e2fe3c97bfe593
      XZ_SHA: 74f84e691aceaa2ce5fc9eac7b7f22b8d140f15016d204425f3ae88d0832d5d6
    steps:
      - name: Checkout staging payload branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check original alpha.2 release tag
        run: |
          set -euo pipefail
          object_type="$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq '.object.type')"
          object_sha="$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq '.object.sha')"
          test "$object_type" = commit
          test "$object_sha" = "$SOURCE_SHA"
          test "$(gh release view "$TAG" --json isPrerelease -q '.isPrerelease')" = true
          test "$(gh release view "$TAG" --json isDraft -q '.isDraft')" = false
      - name: Restore exact full OTA-capable app and check integrity
        run: |
          set -euo pipefail
          mkdir -p dist
          cat release-payload/v0.1.0-alpha.2/part-*.b64 | base64 --decode > /tmp/enevina-full-app.xz
          echo "$XZ_SHA  /tmp/enevina-full-app.xz" | sha256sum --check --status
          xz --decompress --stdout /tmp/enevina-full-app.xz > "dist/$ASSET"
          echo "$APP_SHA  dist/$ASSET" | sha256sum --check --status
          python3 - <<'PY'
          import os, pathlib
          p=pathlib.Path('dist')/os.environ['ASSET']
          d=p.read_bytes()
          assert len(d)==1865408, 'Wrong full firmware size'
          assert d[0]==0xe9, 'Not an ESP32 application image'
          assert d.count(b'ENEVINA_C24_SIGNED_PULL_OTA_CAPABLE_V1')==1, 'Signed OTA capability removed'
          print('FULL-APP: exact SHA, size, ESP header, signed HTTPS OTA marker verified')
          PY
          (cd dist && sha256sum "$ASSET" > "$ASSET.sha256")
          cp docs/release/ALPHA2_FULL_N16R8_TEST_FIRMWARE.md dist/FULL-TEST-FIRMWARE-README.md
      - name: Verify existing alpha.2 source and native tests
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          test "$(git rev-parse "${TAG}^{commit}")" = "$SOURCE_SHA"
          git worktree add --detach tag-source "$TAG"
          (cd tag-source && python3 tools/check_release_hygiene.py)
          cmake -S tag-source -B build-test -DCMAKE_BUILD_TYPE=Release
          cmake --build build-test --parallel 2
          ctest --test-dir build-test --output-on-failure
      - name: Publish full test app only after validation
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq '.object.sha')"
          test "$tag_sha" = "$SOURCE_SHA"
          if gh release view "$TAG" --json assets -q '.assets[].name' | grep -Fxq "$ASSET"; then
            echo 'Full test image already present; do not overwrite.' >&2
            exit 1
          fi
          gh release upload "$TAG" "dist/$ASSET" "dist/$ASSET.sha256" dist/FULL-TEST-FIRMWARE-README.md
          gh release view "$TAG" --json body -q '.body' > /tmp/enevina-existing-notes.md
          python3 - <<'PY'
          from pathlib import Path
          orig=Path('/tmp/enevina-existing-notes.md').read_text()
          addition=Path('docs/release/ALPHA2_FULL_N16R8_TEST_FIRMWARE.md').read_text()
          marker='# Enevina Lite v0.1.0-alpha.2 – täysi ESP32-S3 N16R8 -testifirmware'
          if marker not in orig:
              Path('/tmp/enevina-existing-notes.md').write_text(addition.rstrip()+'\n\n---\n\n'+orig)
          PY
          gh release edit "$TAG" --notes-file /tmp/enevina-existing-notes.md
          gh release view "$TAG" --json url,tagName,isPrerelease,assets
